<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silly-pitch-game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="config-popup flex-center">
        <div class="config-title arial-font">
            <div>Configuration</div>
            <button>X</button>
        </div>
    </div>

    <div class="flex-center">
        <h1 class="title-text arial-font">silly-pitch-game</h1>
    </div>
    <div class="page-body">
        <div class="flex-center">
            <input class="hz-input arial-font" id="hz-input"></input>
            <button class="hz-input-button responsive-btn" id="playSound">Play Sound</button>
        </div>
        <div id="errorMsg" class="error-message flex-center arial-font"></div>

        <br></br>
        <div class="flex-center">
            <p class="input-label arial-font">Max Pitch Deviation</p>
            <input class="pitch-config-input">hi</input>
        </div>

        <div id="game-controls" class="flex-center">
            <button id="startSounds" class="start-sounds-btn responsive-btn arial-font">Start Sounds</button>
        </div>
        <div id="playerChoices" class="flex-center plr-choices">
            <div id="choiceBtnContainer" class="arial-font choice-btn-container">
                <button id="tone-one-btn">1</button>
                <button id="tone-two-btn">2</button>
                <button id="tone-three-btn">3</button>
                <button id="tone-four-btn">4</button>
            </div>
        </div>
        <div id="choiceFeedback" class="flex-center arial-font"></div>
    </div>

</body>

</html>
